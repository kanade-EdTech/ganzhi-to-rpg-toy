    // 圆角矩形辅助函数
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 绘制中式八角星盘暗纹
    function drawCompassWatermark(ctx, cx, cy, radius, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;

      // 同心圆
      [radius, radius * 0.82, radius * 0.62, radius * 0.35].forEach(r => {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // 24山向射线
      for (let i = 0; i < 24; i++) {
        const angle = (i * Math.PI) / 12;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * radius * 0.35, Math.sin(angle) * radius * 0.35);
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 绘制角花装饰
    function drawCornerOrnaments(ctx, x, y, w, h, len, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      const corners = [
        [x, y, 1, 1],
        [x + w, y, -1, 1],
        [x, y + h, 1, -1],
        [x + w, y + h, -1, -1]
      ];
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx + dx * len, cy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx, cy + dy * len);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx + dx * 6, cy + dy * 6);
        ctx.lineTo(cx + dx * (len * 0.55), cy + dy * 6);
        ctx.moveTo(cx + dx * 6, cy + dy * 6);
        ctx.lineTo(cx + dx * 6, cy + dy * (len * 0.55));
        ctx.stroke();
      });
      ctx.restore();
    }

      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#F06A63';
      ctx.font = 'bold 15px "Songti SC", "SimSun", serif';
      ctx.fillText('天命造化印', sealX + 55, sealY + 28);
    }

    function selectPreset(index) {
      currentPresetIndex = index;
      for (let i = 0; i < PRESETS.length; i++) {
        const btn = document.getElementById('btn-preset-' + i);
        if (i === index) {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold border border-[#C8A96B] bg-[#C8A96B]/20 text-[var(--foreground)] transition-all';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-transparent text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all';
        }
      }
      renderShareCard(PRESETS[index]);
    }

    function downloadPoster() {
      const canvas = document.getElementById('shareCanvas');
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      const presetName = PRESETS[currentPresetIndex].name;
      link.download = `生辰造化_命格卡_${presetName}.png`;
      link.href = dataUrl;
      link.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectPreset(0);
    });
  </script>
</body>
</html>
