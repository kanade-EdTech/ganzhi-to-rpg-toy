<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生辰造化 · 小红书竖屏封面</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4">
  <div class="max-w-md mx-auto space-y-3">
    <div class="flex items-center justify-between gap-3">
      <div>
        <h1 class="text-base font-semibold">生辰造化 · 小红书封面 (1080×1440, 3:4)</h1>
        <p class="text-xs text-[var(--muted-foreground)]">基于项目界面：四柱命盘 + RPG 属性面板。</p>
      </div>
      <button onclick="dl()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 whitespace-nowrap">📥 导出 PNG</button>
    </div>
    <div class="rounded-xl overflow-hidden border border-[var(--border)] shadow-lg">
      <canvas id="c" width="1080" height="1440" class="w-full h-auto block"></canvas>
    </div>
  </div>
<script>
const WX = { 木:'#4CAF7A', 火:'#E85D4E', 土:'#E0A84E', 金:'#F2C94C', 水:'#4A98E8' };
const SERIF = '"Songti SC","SimSun","Noto Serif SC",serif';
const SANS = '"Microsoft YaHei","PingFang SC",sans-serif';
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function compass(ctx,cx,cy,R,alpha){
  ctx.save();ctx.translate(cx,cy);
  ctx.strokeStyle=`rgba(200,169,107,${alpha})`;ctx.lineWidth=1.5;
  [1,.84,.66,.4].forEach(k=>{ctx.beginPath();ctx.arc(0,0,R*k,0,Math.PI*2);ctx.stroke();});
  for(let i=0;i<24;i++){const a=i*Math.PI/12;ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*.84,Math.sin(a)*R*.84);ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);ctx.stroke();}
  const br='子丑寅卯辰巳午未申酉戌亥';
  ctx.fillStyle=`rgba(200,169,107,${alpha*1.6})`;ctx.font=`bold ${R*.07}px ${SERIF}`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2;
    ctx.fillText(br[i],Math.cos(a)*R*.75,Math.sin(a)*R*.75);}
  ctx.restore();
}

function draw(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1080,H=1440;
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0E1016');g.addColorStop(.5,'#171B24');g.addColorStop(1,'#0B0D12');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(540,900,20,540,900,700);
  glow.addColorStop(0,'rgba(200,169,107,.20)');glow.addColorStop(1,'rgba(200,169,107,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  compass(ctx,540,330,420,.06);
  compass(ctx,1000,1380,300,.05);

  ctx.strokeStyle='rgba(200,169,107,.45)';ctx.lineWidth=2;ctx.strokeRect(30,30,W-60,H-60);
  ctx.strokeStyle='rgba(200,169,107,.16)';ctx.lineWidth=1;ctx.strokeRect(42,42,W-84,H-84);

  // ===== 顶部标题 =====
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#C8A96B';ctx.font=`600 24px ${SANS}`;
  ctx.fillText('GANZHI · TO · RPG · TOY',540,120);

  ctx.save();ctx.shadowColor='rgba(255,184,0,.45)';ctx.shadowBlur=40;
  const tg=ctx.createLinearGradient(0,170,0,340);
  tg.addColorStop(0,'#FFE9A8');tg.addColorStop(1,'#C8A96B');
  ctx.fillStyle=tg;ctx.font=`bold 190px ${SERIF}`;
  ctx.fillText('生辰造化',540,320);ctx.restore();

  ctx.fillStyle='#E8E3D6';ctx.font=`500 46px ${SERIF}`;
  ctx.fillText('你的生日，是什么 RPG 面板？',540,404);

  // 五行灵珠
  let ox=540-2*70;
  Object.entries(WX).forEach(([k,c])=>{
    ctx.beginPath();ctx.arc(ox,466,24,0,Math.PI*2);
    ctx.fillStyle='#14171F';ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=c;ctx.font=`bold 26px ${SERIF}`;ctx.fillText(k,ox,475);ox+=70;
  });

  // ===== 中部：UI 卡片 =====
  const px=80,py=520,pw=920,ph=640;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=50;ctx.shadowOffsetY=20;
  rr(ctx,px,py,pw,ph,24);ctx.fillStyle='rgba(24,27,35,.96)';ctx.fill();ctx.restore();
  rr(ctx,px,py,pw,ph,24);ctx.strokeStyle='rgba(200,169,107,.6)';ctx.lineWidth=2;ctx.stroke();

  // 卡头
  ctx.beginPath();ctx.arc(px+80,py+78,44,0,Math.PI*2);
  ctx.fillStyle='rgba(232,93,78,.18)';ctx.fill();ctx.strokeStyle=WX.火;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=WX.火;ctx.font=`bold 32px ${SERIF}`;ctx.fillText('丙火',px+80,py+90);
  ctx.textAlign='left';
  ctx.fillStyle='#F5F0E6';ctx.font=`bold 34px ${SANS}`;ctx.fillText('裴烬霄',px+148,py+68);
  ctx.fillStyle='#F2C94C';ctx.font=`bold 26px ${SERIF}`;ctx.fillText('【 傲世破法狂儒 · 伤官格 】',px+148,py+110);
  rr(ctx,px+pw-150,py+40,110,38,8);ctx.fillStyle='rgba(255,184,0,.2)';ctx.fill();
  ctx.strokeStyle='#FFB800';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#FFD04D';ctx.font=`bold 22px ${SANS}`;ctx.textAlign='center';
  ctx.fillText('SSR',px+pw-95,py+67);

  // 四柱
  const P=[['壬','水','子','水','年'],['己','土','酉','金','月'],['丙','火','寅','木','日'],['甲','木','午','火','时']];
  const cw=200,cg=20,sx=px+30,sy=py+150;
  P.forEach((p,i)=>{
    const x=sx+i*(cw+cg);
    rr(ctx,x,sy,cw,180,12);
    ctx.fillStyle=i==2?'rgba(200,169,107,.12)':'rgba(14,16,22,.85)';ctx.fill();
    ctx.strokeStyle=i==2?'#C8A96B':'rgba(255,255,255,.1)';ctx.lineWidth=i==2?2:1;ctx.stroke();
    ctx.textAlign='center';
    ctx.fillStyle='#8E9299';ctx.font=`20px ${SANS}`;ctx.fillText(p[4]+'柱',x+cw/2,sy+32);
    ctx.fillStyle=WX[p[1]];ctx.font=`bold 60px ${SERIF}`;ctx.fillText(p[0],x+cw/2,sy+102);
    ctx.fillStyle=WX[p[3]];ctx.fillText(p[2],x+cw/2,sy+162);
  });
  ctx.textAlign='left';

  // 属性条
  const S=[['伤官','技能伤害','+48.5%',.92,'#FFB800'],
           ['偏印','冷却缩减','+34.2%',.78,'#C066E8'],
           ['正财','金币掉率','+62.0%',.84,'#C066E8'],
           ['七杀','卖血增益','+0.68%',.58,'#4A98E8'],
           ['比肩','生命上限','2,180',.48,'#4A98E8']];
  S.forEach((s,i)=>{
    const y=sy+212+i*50,x=px+30,w=pw-60;
    rr(ctx,x,y,68,36,8);ctx.fillStyle=s[4]+'30';ctx.fill();
    ctx.strokeStyle=s[4];ctx.lineWidth=1.3;ctx.stroke();
    ctx.fillStyle=s[4];ctx.font=`bold 21px ${SANS}`;ctx.textAlign='center';ctx.fillText(s[0],x+34,y+26);
    ctx.textAlign='left';ctx.fillStyle='#E5E7EB';ctx.font=`500 24px ${SANS}`;
    ctx.fillText(s[1],x+86,y+27);
    rr(ctx,x+260,y+11,380,14,7);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fill();
    rr(ctx,x+260,y+11,380*s[3],14,7);ctx.fillStyle=s[4];ctx.fill();
    ctx.textAlign='right';ctx.fillStyle=s[4];ctx.font=`bold 26px ${SANS}`;
    ctx.fillText(s[2],x+w,y+28);ctx.textAlign='left';
  });

  // ===== 底部：卖点 =====
  ctx.textAlign='center';
  const tags=['公历 / 农历','现代时 / 十二时辰','±5000 年万年历','十神 → 游戏数值'];
  ctx.font=`26px ${SANS}`;
  const pos=[[270,1230],[610,1230],[270,1296],[610,1296]];
  tags.forEach((t,i)=>{
    const w=ctx.measureText(t).width+44,x=i%2?540+14:540-14-w;
    const cx=(i%2)?x:x;
    const y=1210+Math.floor(i/2)*64;
    rr(ctx,cx,y,w,48,24);ctx.fillStyle='rgba(200,169,107,.12)';ctx.fill();
    ctx.strokeStyle='rgba(200,169,107,.55)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#E5C88E';ctx.fillText(t,cx+w/2,y+33);
  });

  ctx.fillStyle='#F2C94C';ctx.font=`bold 38px ${SERIF}`;
  ctx.fillText('输入生辰 · 一键生成先天命格卡',540,1384);
  ctx.fillStyle='#6E737D';ctx.font=`22px ${SANS}`;
  ctx.fillText('把生辰，变成你的角色面板',540,1416-10);
}
function dl(){
  const a=document.createElement('a');a.download='ganzhi_rpg_xhs_cover.png';
  a.href=document.getElementById('c').toDataURL('image/png');a.click();
}
draw();
</script>
</body>
</html>
